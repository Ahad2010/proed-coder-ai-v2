services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proed
      POSTGRES_PASSWORD: proed_dev
      POSTGRES_DB: proed_coder_ai
    ports:
      - "5432:5432"
    volumes:
      - proed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proed -d proed_coder_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proed_pgdata:
